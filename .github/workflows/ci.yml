name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Install, ingest, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # CI ingests + tests against the offline `local` (bge-small) backend
        # so it stays self-contained and doesn't burn Cohere quota. Production
        # uses Cohere; the API surface is identical either way.
        run: pip install -r requirements.txt -r requirements-local.txt

      - name: Build the Chroma vector store
        run: python scripts/ingest.py --clear
        env:
          PYTHONPATH: .

      - name: Run tests
        # --live opts into tests that make real LLM API calls. CI has the
        # GROQ_API_KEY secret available so the full suite runs end-to-end.
        # Local dev defaults to skipping live tests to protect daily quota.
        run: pytest tests/ -v --live
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK is not set. Skipping deploy."
            exit 0
          fi
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Triggered Render deploy hook."
